<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta charset="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stellar Remains Museum - The Outer Space Museum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600;&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="mars-stage">
        <img src="space-bg.jpg" alt="THE OUTER SPACE MUSEUM" class="bg-image"/>
        <div class="bg-overlay"></div>

        <header class="mars-header">
            <div class="header-left">
                <a href="index.html" class="brand-badge">
                    <img src="badge.jpg" alt="Team Emblem" onerror="this.style.display='none'"/>

                </a>
                <span class="header-divider"></span>
                <div class="museum-heading">
                    <h1 class="main-title"> THE OUTER SPACE MUSEUM</h1>
                    <div class="title-underline"></div>
                    <p class="tagline">Let's explore the infinite space</p>
                </div>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="journey.html" class="nav-link">Explore</a>
                <a href="#team" class="nav-link">Team</a>
            </nav>
        </header>

        <div class="detailed-plaque-overlay" id="detailedPlaque" hidden>
            <div class="detailed-plaque-content">
                <button type="button" class="close-plaque" id="closePlaque">&times;</button>

                <div class="detailed-grid">
                    <div class="detailed-item-active">
                        <img src="pioneer10_small.jpg" alt="artifact Preview" class="small-rover-img" id="plaqueImg"/>
                        <div class="detailed-text">
                            <span class="rover-name-detailed" id="plaqueName">Pioneer 10</span>
                            <span class="rover-type-detailed" id="plaqueType">Space Probe</span>
                        </div>
                    </div>

                    <a href="#" class="detailed-item detailed-btn" id="btnStory">
                        <span class="item-title">Story</span>
                        <span class="circle-arrow-small">&rarr;</span>
                    </a>

                    <a href="#" class="detailed-item detailed-btn" id="btnVideos">
                        <span class="item-title">Videos</span>
                        <span class="circle-arrow-small">&rarr;</span>
                    </a>

                    <a href="#" class="detailed-item detailed-btn" id="btn3D">
                        <span class="item-title">3D modules</span>
                        <span class="circle-arrow-small">&rarr;</span>
                    </a>

                    <a href="#" class="detailed-item detailed-btn" id="btnInfo">
                        <span class="item-title">Information</span>
                        <span class="circle-arrow-small">&rarr;</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="plaque plaque-pioneer">
            <div class="plaque-text">
                <span class="rover-name">Pioneer 10</span>
                <span class="rover-type">Space Probe</span>
            </div>
            <a href="#" class="circle-arrow-btn" data-target="pioneer10" aria-label="Explore Pioneer 10">
                &rarr;
            </a>
        </div>

        <div class="plaque plaque-voyager1">
            <div class="plaque-text">
                <span class="rover-name">
                    <span class="rover-type">Pace Probe</span>
            </div>
            <a href="#" class="circle-arrow-btn" data-target="voyager1" aria-label="Explore Voyager 1">
                &rarr;
            </a>
        </div>

        <div class="plaque plaque-voyager2">
            <div class="plaque-text">
                <span class="rover-name">Voyager 2</span>
                <span class="rover-type">Space Probe</span>
            </div>
            <a href="#" class="circle-arrow-btn" data-target="voyager2" aria-label="Explore voyager2">
                &rarr;
            </a>
        </div>
        <a href="space2.html" class="side-next-btn" aria-label="Next Section">
            &rarr;
        </a>
    </main>
    <script src="script.js"></script>
</body>
</html>
