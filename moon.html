<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stellar Remains Museum - The Moon Museum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="mars-stage pg-moon1 theme-moon">
        <img src="moon-bg.jpg" alt="The Moon Museum" class="bg-image"/>
        <div class="bg-overlay"></div>
        <header class="mars-header">
            <div class="header-left">
                <a href="index.html" class="brand-badge"><img src="badge.jpg" alt="Team Emblem" onerror="this.style.display='none'"/></a>
                <span class="header-divider"></span>
                <div class="museum-heading">
                    <h1 class="main-title">LOST BUT NOT FORGOTTEN</h1>
                    <h2 class="sub-title">THE MOON MUSEUM</h2>
                    <div class="title-underline"></div>
                    <p class="tagline">Let's explore the lunar world</p>
                </div>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="journey.html" class="nav-link active">Explore</a>
                <a href="team.html" class="nav-link">Team</a>
            </nav>
        </header>
        <div class="detailed-plaque-overlay" id="detailedPlaque" hidden>
            <div class="detailed-plaque-content">
                <button type="button" class="close-plaque" id="closePlaque" aria-label="Close">&times;</button>
                <div class="detailed-item active">
                    <img src="apollo11-small.jpg" alt="Artifact preview" class="small-rover-img" id="plaqueImg" onerror="this.style.display='none'"/>
                    <div class="detailed-text"><span class="rover-name-detailed" id="plaqueName">Apollo 11 Lunar Module</span><span class="rover-type-detailed" id="plaqueType">Descent Stage</span></div>
                </div>
                <a href="#" class="detailed-item detailed-btn" id="btnStory"><span class="item-title">Story</span><span class="circle-arrow-small">&rarr;</span></a>
                <a href="#" class="detailed-item detailed-btn" id="btnVideos"><span class="item-title">Videos</span><span class="circle-arrow-small">&rarr;</span></a>
                <a href="#" class="detailed-item detailed-btn" id="btn3D"><span class="item-title">3D model</span><span class="circle-arrow-small">&rarr;</span></a>
                <a href="#" class="detailed-item detailed-btn" id="btnInfo"><span class="item-title">Information</span><span class="circle-arrow-small">&rarr;</span></a>
            </div>
        </div>
        <div class="plaque plaque-1">
            <div class="plaque-text"><span class="rover-name">Apollo Lunar Module</span><span class="rover-type">Descent stage</span></div>
            <a href="#" class="circle-arrow-btn" data-target="apollo11" aria-label="Explore Apollo Lunar Module">&rarr;</a>
        </div>
        <div class="plaque plaque-2">
            <div class="plaque-text"><span class="rover-name">Lunar Roving Vehicle</span><span class="rover-type">(LRV) - Apollo 15</span></div>
            <a href="#" class="circle-arrow-btn" data-target="lrv" aria-label="Explore Lunar Roving Vehicle">&rarr;</a>
        </div>
        <div class="plaque plaque-3">
            <div class="plaque-text"><span class="rover-name">Surveyor 3</span><span class="rover-type">Lander</span></div>
            <a href="#" class="circle-arrow-btn" data-target="surveyor3" aria-label="Explore Surveyor 3">&rarr;</a>
        </div>
        <a href="moon2.html" class="side-next-btn" aria-label="Next Section">&rarr;</a>
    </main>
<script src="script.js"></script>
</body>
</html>
