<!DOCTYPE html>
<html lang="en">
<head></head>
    <meta charset="UTF-8"/>
    <meta charset="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stellar Remains Museum - The Mars Museum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600;&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="mars-stage">
        <img src="mars-bg.jpg" alt="The Mars Museum" class="bg-image"/>
        <div class="bg-overlay"></div>

        <header class="mars-header">
            <div class="header-left">
                <a href="index.html" class="brand-badge">
                    <img src="badge.jpg" alt="Team Emblem" onerror="this.style.display='none'"/>
                </a>
                <span class="header-divider"></span>
                <div class="museum-heading">
                    <h1 class="main-title">LOST BUT NOT FORGOTTEN</h1>
                    <h2 class="sub-title">THE MARS MUSEUM</h2>
                    <div class="title-underline"></div>
                    <p class="tagline">Let's explore the red planet </p>
                </div>
            </div>

            <nav class="navlinks">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#about" class="nav-link"> About</a>
                <a href="journey.html" class="nav-link active">Explore</a>
                <a href="#team" class="nav-link"> Team</a>
            </nav>
        </header>

        <div class="plaque plaque-viking">
            <div class="plaque-text">
                <span class="rover-name">VIKING 1</span>
                <span class="rover-type">Lander</span>
            </div>
            <a href="#" class="circle-arrow-btn" data-target="pathfinder" aria-label="Explore Mars Pathfinder Lander">
                &rarr;
            </a>
        </div>

        <div class="plaque plaque-sojourner">
            <div class="plaque-text">
                <span class="rover-name">Sojourner</span>
                <span class="rover-type">Rover</span>
            </div>
            <a href="#" class="circle-arrow-btn" data-target="sojourner" aria-label="Explore Sojourner Rover">
                &rarr;
            </a>
        </div>

        <a href="#" class="side-next-btn" data-target="nextsection" aria-label="Next Section">
            &rarr;
        </a>
    </main>
    <script src="script.js"></script>
</body>
</html>
