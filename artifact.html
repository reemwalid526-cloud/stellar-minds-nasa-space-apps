<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta charset="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stellar Remains Museum - The Moon Museum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600;&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="artifact-stage">

        <img src="artifact-bg.jpg" alt="Cosmic Background" class="bg-image"/>
        <div class="bg-overlay-deep"></div>

        <header class="navbar">
            <a href="index.html" class="brand">
                <div class="brand-badge">
                    <img src="badge.jpg" alt="Team Emblem" onerror="this.style.display='none'"/>
                </div>
                <span class="brand-divider"></span>
                <div class="brand-text">
                    <span class="brand-title">Stellar Remians</span>
                    <span class="brand-title">Museum</span>
                </div>
            </a>

            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="journey.html" class="nav-link">Explore</a>
                <a href="team.html" class="nav-link">Team</a>
            </nav>
        </header>

        <section class="artifact-container">
            <div class="artifact-top-bar">
                <button type="button" class="back-hall-btn" id="backToHallBtn">
                    &larr; Back to Museum backToHallBtn
                    </button>
                    <div class="artifact-header-info">
                        <span class="artifact-category" id="artifactCategory"> MARS COLLECTION</span>
                        <h1 class="artifact-main-title" id="artifactTitle">Viking 1 Lander</h1>
                    </div>
                </div>

                <div class="artifact-tabs">
                    <button type="button" class="tab-btn active" data-tab="Story">Story</button>
                    <button type="button" class="tab-btn" data-tab="videos">Videos</button>
                    <button type="button" class="tab-btn" data-tab="3D module"></button>
                    <button type="button" class="tab-btn" data-tab="info">Information &amp; Docs</button>
                </div>

                <div class="artifact-content-box"></div>

                <div class="tab-panel active" id="panel-story">
                    <div class="story-layout">
                        <div class="story-image-wrapper">
                            <img src="viking_small.jpg" alt="Artifact Image" id="storyImg" class="artifact-showcase-img"/>
                        </div>

                        <div class="story-text-wrapper">
                            <h2 class="panel-heading">The Mission Story</h2>
                            <p class="panel-paragraph" id="storyText">
                                Loading mission story...
                            </p>
                        </div>
                    </div>
                </div>

                <div class="tab-panel" id="panel-videos hidden">
                    <h2 class="panel-heading">Mission Footage &amp;</h2>
                    <div class="videos-grid">
                        <div class="video-card">
                            <h3 class="video-label">Our Custom Story Videos</h3>
                            <div class="video-wrapper">
                                <video controls id="customVideoPlayer" class="media-frame">
                                    <source src="" type="video/mp4"/>
                                    Your browser does not support the video tag.
                                </video>
                            </div>
                        </div>

                        <div class="video-card">
                            <h3 class="video-label">Official NASA Archive Video</h3>
                            <div class="video-wrapper">
                                <iframe id="nasaVideoFrame" class="media-frame" src="" title="NASA Video" frameborder="0" allowfullscreen></iframe>
                            </div>
                    </div>
                </div>
            </div>

            <div class="tab-panel" id="panel-model3d" hidden>
                <h2 class="panel-heading">Interactive 3D Model</h2>
                <div class="model-viewer-wrapper">
                    <iframe id="model3dFrame" class="model-frame" src="" title="3D Spacecraft Model" frameborder="0" allow fullscreen></iframe>

                </div>
            </div>

            <div class="tab-panel" id="panel-info" hidden>
                <h2 class="panel-heading"> Technical Specifications &amp; Research Library</h2>
                <div class="specs-table" id="spaceContainer">

                </div>
                <div class="docs-download-area" id="docsContainer">

                </div>
            </div> 
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
