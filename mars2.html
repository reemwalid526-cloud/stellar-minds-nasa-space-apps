    <main class="mars-stage">

            <nav class="nav-links">
                <a href="index.html" class=nav-link>Home</a>

            <header>

                    <div class="plaque-text">

                    <a href="#" class="circle-arrow-btn" data-target="spirit" aria-label="Explore Spirit Rover">

                </div>

                    <div class="plaque-text">
