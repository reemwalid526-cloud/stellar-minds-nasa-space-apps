<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta charset="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stellar Remains Museum - The Moon Museum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600;&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <main class="mars-stage">

        <img src="space2-bg.jpg" alt="The Outer Space Museum" class="bg-image"/>
        <div class="bg-overlay"></div>

        <header class="mars-header">
            <div class="header-left">
                <a href="index.html" class="brand-badge">
                    <img src="badge.jpg" alt="Team Emblem" onerror="this.style.display='none'"/>
                </a>
                <span class="header-divider"></span>
                <div class="museum-heading">
                    <h1 class="main-title">LOST BUT NOT FORGOTTEN</h1>
                    <h2 class="sub-title">THE MOON MUSEUM</h2>
                    <div class="title-underline"></div>
                    <p class="tagline">Let's explore the luner world</p>
                </div>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="journey.html" class="nav-link">Explore</a>
                <a href="#team" class="nav-link">Team</a>
                </nav>
            </header>

            
                <div class="detailed-plaque-overlay" id="detailedPlaque" hidden>
                    <div class="detailed-plaque-content">
                        <button type="button" class="close-plaque" id="closePlaque">&times;</button>

                        <div class="detailed-grid">
                            <div class="detailed-item-active">
                                <img src="kepler_small.jpg" alt="artifact Preview" class="small-rover-img" id="plaqueImg"/>
                                <div class="detailed-text">
                                    <span class="rover-name-detailed" id="plaqueName">Kepler Space Telescope</span>
                                    <span class="rover-type-detailed" id="plaqueType">Space Observatory</span>
                                </div>
                            </div>

                            <a href="#" class="detailed-item detailed-btn" id="btnStory">
                                <span class="item-title">Story</span>
                                <span class="circle-arrow-small">&rarr;</span>
                            </a>

                            <a href="#" class="detailed-item detailed-btn" id="btnVideos">
                                <span class="item-title">Videos</span>
                                <span class="circle-arrow-small">&rarr;</span>
                            </a>

                            <a href="#" class="detailed-item detailed-btn" id="btn3D">
                                <span class="item-title">3D modules</span>
                                <span class="circle-arrow-small">&rarr;</span>
                            </a>

                            <a href="#" class="detailed-item detailed-btn" id="btnInfo">
                                <span class="item-title">Information</span>
                                <span class="circle-arrow-small">&rarr;</span>
                            </a>
                        </div>
                    </div>
                </div>
                

                <div class="plaque plaque-kepler">
                    <div class="plaque-text">
                        <span class="rover-name">Kepler Space</span>
                        <span class="rover-type">Telescope</span>
                    </div>
                    <a href="#" class="circle-arrow-btn" data-target="kepler" aria-label="Explore Kepler Space Telescope">
                        &rarr;
                    </a>
                </div>

                <div class="plaque plaque-spitzer">
                    <div class="plaque-text">
                        <span class="rover-name">Spitzer Space</span>
                        <span class="rover-type">Telescope</span>
                    </div>
                    <a href="#" class="circle-arrow-btn" data-target="spitzer" aria-label="Explore Spitxer Spcae Telescope">
                        &rarr;
                    </a>
                </div>

                <div class="plaque plaque-dawn">
                    <div class="plaque-text">
                        <span class="rover-name">Dwan</span>
                        <span class="rover-type">Spacecarft</span>
                    </div>
                    <a href="#" class=" circle-arrow-btn" data-target="dawn" aria-label="Explore Dawn Spacecraft">
                        &rarr;
                    </a>
                </div>

                <a href="space.html" class="side-prev-btn" aria-label="Previous Section">
                    &rarr;
                </a>
            </main>
    <script src="script.js"></script>
</body>
</html>
